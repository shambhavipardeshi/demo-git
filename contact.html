<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>Contact · Hello, World!</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap");
      :root { color-scheme:dark; --ink:#f8fafc; --muted:#b6c3d6; --line:rgba(255,255,255,.18); } * { box-sizing:border-box; }
      body { min-height:100vh; margin:0; display:grid; place-items:center; background:#111827; color:var(--ink); font-family:"DM Mono",monospace; }
      .glow { position:fixed; width:42rem; height:42rem; border-radius:50%; filter:blur(30px); opacity:.68; pointer-events:none; } .one { background:#fb7185; top:-24rem; left:-16rem; } .two { background:#38bdf8; bottom:-27rem; right:-13rem; }
      main { position:relative; width:min(92vw,920px); padding:clamp(2rem,7vw,5.5rem); border:1px solid var(--line); border-radius:28px; background:rgba(15,23,42,.62); box-shadow:0 28px 80px rgba(0,0,0,.35); backdrop-filter:blur(18px); }
      main::before { content:""; position:absolute; inset:12px; border:1px solid rgba(255,255,255,.08); border-radius:18px; pointer-events:none; }
      nav { position:relative; z-index:1; display:flex; justify-content:flex-end; gap:1.25rem; margin-bottom:clamp(3rem,8vw,5rem); font-size:.76rem; } nav a { color:#cbd5e1; text-decoration:none; } nav a:hover, nav a[aria-current="page"] { color:#fda4af; }
      .eyebrow { color:#fda4af; font-size:.76rem; letter-spacing:.14em; text-transform:uppercase; } h1 { margin:.8rem 0 1.3rem; font-family:"Playfair Display",Georgia,serif; font-size:clamp(3.5rem,10vw,7rem); letter-spacing:-.07em; line-height:.92; } h1 em { color:#7dd3fc; font-weight:600; }
      .copy { max-width:560px; color:var(--muted); line-height:1.8; } .email { display:inline-block; margin-top:2rem; padding:.85rem 1.15rem; border:1px solid rgba(125,211,252,.55); border-radius:999px; color:#e0f2fe; text-decoration:none; font-size:.85rem; transition:background .2s,transform .2s; } .email:hover { background:rgba(125,211,252,.15); transform:translateY(-2px); }
      .footer { display:flex; justify-content:space-between; gap:1rem; margin-top:4rem; padding-top:1.25rem; border-top:1px solid var(--line); color:#94a3b8; font-size:.72rem; } @media (max-width:460px) { .footer { flex-direction:column; } }
    </style>
  </head>
  <body>
    <div class="glow one"></div><div class="glow two"></div>
    <main>
      <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
      <p class="eyebrow">Say hello</p>
      <h1>Let's make <em>something.</em></h1>
      <p class="copy">Have an idea, a question, or simply a good story to share? We would love to hear from you.</p>
      <a class="email" href="mailto:hello@example.com">hello@example.com ↗</a>
      <div class="footer"><span>OPEN FOR CONVERSATION</span><span>DROP A LINE ✦</span></div>
    </main>
  </body>
</html>
